# IRC:5 Hydraulic Standards (M0 placeholder)
# M1 populates: Lacey's regime equations, scour coefficients
lacey:
  silt_factor_range: [0.8, 1.76]
scour:
  design_depth_multiplier: 2.0
  maximum_multiplier: 2.5
waterway:
  linear_waterway_coeff: 4.8  # Q=CA sqrt(H)
afflux:
  formula: "kindsvater_carter"
  max_allowable_m: 0.3
